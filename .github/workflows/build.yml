name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Forge and Fabric jars
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Forge jar
        run: ./gradlew --no-daemon :forge:build

      - name: Build Fabric jar
        run: ./gradlew --no-daemon :fabric:build

      - name: Verify separated loader artifacts
        run: ./gradlew --no-daemon verifyLoaderArtifacts

      - name: Upload Forge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openysm-forge-jars
          path: forge/build/libs/openysm-forge-1.20.1-*.jar
          if-no-files-found: error

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openysm-fabric-jars
          path: fabric/build/libs/openysm-fabric-1.20.1-*.jar
          if-no-files-found: error
