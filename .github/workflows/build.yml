name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Forge/Fabric-compatible jar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew --no-daemon build verifyFabricEntrypoints

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openysm-jars
          path: build/libs/*.jar
          if-no-files-found: error
